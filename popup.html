<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; padding: 15px; font-family: sans-serif; }
    .group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select { width: 100%; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #409EFF; color: white; border: none; cursor: pointer; border-radius: 4px; }
    button:hover { background: #66b1ff; }
    button.stop { background: #F56C6C; margin-top: 5px; }
    #status { margin-top: 10px; font-size: 12px; color: #666; text-align: center; }
  </style>
</head>
<body>
  <h3>Exam Assistant Config</h3>
  
  <div class="group">
    <label>API Provider</label>
    <select id="provider">
      <option value="openai">OpenAI (GPT)</option>
      <option value="gemini">Google Gemini</option>
      <option value="qwen">Qwen (DashScope)</option>
      <option value="deepseek">DeepSeek</option>
      <option value="glm">GLM (BigModel)</option>
    </select>
  </div>

  <div class="group">
    <label>API Key</label>
    <input type="password" id="apiKey" placeholder="sk-...">
  </div>

  <div class="group">
    <label>API URL (Optional)</label>
    <input type="text" id="apiUrl" placeholder="Leave blank for default URL">
    <small style="color: #909399; font-size: 11px;">Custom API endpoint. Leave empty to use default.</small>
  </div>

  <div class="group">
    <label>Model Name</label>
    <input type="text" id="modelName" placeholder="gpt-4o-mini or gemini-1.5-flash">
  </div>

  <div class="group" style="display: flex; align-items: center;">
    <input type="checkbox" id="debugMode" style="width: auto; margin-right: 10px;">
    <label for="debugMode" style="margin: 0; font-weight: normal;">Enable Debug Mode (Verify Questions)</label>
  </div>

  <div class="group">
    <label>Short Answer Prompt (Optional)</label>
    <textarea id="shortAnswerPrompt" placeholder="e.g., Please translate this sentence to Japanese / Solve this math problem" style="width: 100%; height: 60px; padding: 8px; box-sizing: border-box; resize: vertical; font-family: sans-serif;"></textarea>
    <small style="color: #909399; font-size: 11px;">Custom instruction for short answer questions. Leave blank for default behavior.</small>
  </div>

  <button id="saveBtn">Save Settings</button>
  <button id="testBtn" style="background:#67C23A; margin-top: 8px;">Test Connection</button>
  <div id="testResult" style="margin-top: 10px; padding: 8px; border-radius: 4px; font-size: 12px; display: none;"></div>
  <div id="status" style="margin-top: 10px; font-size: 12px; color: #666; text-align: center;"></div>
  
  <hr style="margin:12px 0;">
  <h4>Detected Questions</h4>
  <div class="group">
    <button id="fetchQuestions">Fetch Questions From Page</button>
  </div>
  <div class="group">
    <button id="selectOnPage" style="background:#fff;color:#409EFF;border:1px solid #e6e6e6;margin-top:6px;">Select On Page</button>
  </div>
  <div class="group" id="questionArea" style="max-height:220px; overflow:auto; border:1px solid #eee; padding:8px; border-radius:6px; display:none;">
    <!-- Question list will be injected here -->
  </div>
  <div class="group" style="display:flex; gap:8px;">
    <button id="batchAI" style="flex:1;">Request AI for Selected</button>
    <button id="applySelected" style="flex:1; background:#67C23A;">Apply Selected</button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
